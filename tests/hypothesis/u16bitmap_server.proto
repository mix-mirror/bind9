syntax = "proto3";

package u16bitmap;

message Command {
  message Set {
    uint32 value = 1;
  }

  message Unset {
    uint32 value = 1;
  }

  message Get {}

  message Popcount {}

  message Isset {
    uint32 value = 1;
  }

  message Next {
    int64 value = 1;
  }

  message Compress {}

  message Reset {}

  oneof command {
    Set set = 1;
    Unset unset = 2;
    Get get = 3;
    Popcount popcount = 4;
    Isset isset = 5;
    Reset reset = 6;
    Next next = 7;
    Compress compress = 8;
  }
}

message Response {
  message Ok {}

  message Value {
    bool present = 1;
  }

  message Values {
    uint32 count = 1;
    repeated uint32 values = 2;
  }

  message Count {
    uint32 count = 1;
  }

  message Next {
    int64 value = 1;
  }

  message Wire {
    bytes wire = 1;
  }

  message Error {
    string error = 1;
  }

  oneof response {
    Ok ok = 1;
    Value value = 2;
    Values values = 3;
    Count count = 4;
    Error error = 5;
    Next next = 6;
    Wire wire = 7;
  }
}
