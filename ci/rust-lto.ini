# C/Rust ThinLTO using Clang and LLD. Use matching LLVM versions for rustc,
# clang, and lld (check rustc -vV, clang --version, and ld.lld --version).
# Requires Clang support for -ffat-lto-objects for BIND's named-lto mode.
#
# Use a fresh build directory; optionally layer after ci/common.ini:
#   CCACHE_DIR="$PWD/codex_ccache" meson setup build-rust-lto \
#       --native-file ci/rust-lto.ini
#   CCACHE_DIR="$PWD/codex_ccache" meson compile -C build-rust-lto
#
# Meson's b_lto must stay disabled: BIND supplies the C ThinLTO flags, and
# linker-plugin-lto defers Rust optimization to the final LLVM link.

[binaries]
c = 'clang'
c_ld = 'lld'
ar = 'llvm-ar'
rust = 'rustc'
rust_ld = 'clang'

[built-in options]
optimization = '3'
b_lto = false
# Apply at every C link, including libisc and unit tests, not just named.
c_link_args = ['-flto=thin']
rust_args = ['-C', 'linker-plugin-lto']
rust_link_args = ['-fuse-ld=lld', '-flto=thin']

[project options]
named-lto = 'thin'
