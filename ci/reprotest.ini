# Configuration for the reproducible-build job.
#
# This file deliberately does not inherit ci/common.ini and only carries the
# compiler and flags the job used before the ci/*.ini files existed.  The job
# checks that a build is byte-for-byte reproducible, so it keeps the configured
# build as small as possible instead of tracking the full CI option set: every
# extra option enabled here is more code that has to come out identical twice,
# and the job already has to work around nondeterminism (see the -ffat-lto-
# objects comment in .gitlab-ci.yml).
#
#   meson reprotest -- --native-file ci/reprotest.ini -Ddnstap=disabled

[binaries]
c = 'gcc'

[built-in options]
c_args = ['-fno-omit-frame-pointer', '-fno-optimize-sibling-calls']
