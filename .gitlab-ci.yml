# Experiment branch: only the respdiff jobs are kept so that a pipeline
# answers one question in ~15 minutes. Everything else from main's
# .gitlab-ci.yml is dropped; when rebasing onto main, keep this file.

variables:
  # The default timeout is 60 minutes. Set RUNNER_SCRIPT_TIMEOUT to 55m to
  # leave room for the after_script timeout that defaults to 5m.
  RUNNER_SCRIPT_TIMEOUT: 55m
  # Not normally needed, but may be if some script uses `apt-get install`.
  DEBIAN_FRONTEND: noninteractive
  # Locale settings do not affect the build, but might affect tests.
  LC_ALL: C

  # enable junk filling via jemalloc option
  MALLOC_CONF: "junk:true"

  CI_REGISTRY_IMAGE: registry.gitlab.isc.org/isc-projects/images/bind9

  GIT_DEPTH: 1
  GIT_CLEAN_FLAGS: -ffdxq

  BUILD_PARALLEL_JOBS: 6

default:
  interruptible: true

  # AWS can interrupt the spot instance anytime, so let's retry the job when
  # the interruption event happens to avoid a pipeline failure.
  retry:
    max: 2
    when:
      - runner_system_failure

include:
  - project: 'isc-projects/bind9-qa'
    file: '/.gitlab-ci-common.yml'

stages:
  - system

.linux-amd64: &linux_amd64
  tags:
    - linux
    - aws
    - runner-manager
    - amd64

.debian-trixie-amd64: &debian_trixie_amd64_image
  image: "$CI_REGISTRY_IMAGE:debian-trixie-amd64"
  <<: *linux_amd64

.base: &base_image
  <<: *debian_trixie_amd64_image

# Branch pipelines only (push, web, schedule). Merge request pipelines are
# skipped so that a push does not start the same jobs twice.
.experiment-rules: &experiment_rules
  rules:
    - if: '$CI_COMMIT_BRANCH'

.configure: &configure
    - meson setup
      --native-file ci/common.ini
      $EXTRA_SETUP_FILES
      build

.git-clone-bind9-qa: &git_clone_bind9-qa
  - git clone --depth 1 https://gitlab.isc.org/isc-projects/bind9-qa.git "$CI_PROJECT_DIR"/bind9-qa

.setup_interfaces: &setup_interfaces
    - if [ "$(id -u)" -eq "0" ]; then
        sh -x build/bin/tests/system/ifconfig.sh up;
      else
        sudo sh -x build/bin/tests/system/ifconfig.sh up;
      fi

.respdiff: &respdiff_job
  <<: *experiment_rules
  stage: system
  before_script:
    - *configure
    - meson compile -C build
    - *setup_interfaces
    - *git_clone_bind9-qa
    - cd "$CI_PROJECT_DIR"/bind9-qa/respdiff
  after_script:
    - cd "$CI_PROJECT_DIR"/bind9-qa/respdiff
    - if [ ! -e rspworkdir/report.json ]; then respdiff/msgdiff.py --config rspworkdir/respdiff.cfg rspworkdir; fi
    - if [ ! -e rspworkdir/report.txt ]; then respdiff/diffsum.py --config rspworkdir/respdiff.cfg --limit 0 rspworkdir | tee rspworkdir/report.txt; fi
  needs: []
  artifacts:
    paths:
      - bind9-qa/respdiff
    exclude:
      - bind9-qa/respdiff/rspworkdir/data.mdb # Exclude a 10 GB file.
    untracked: true
    when: always

respdiff:
  <<: *respdiff_job
  <<: *base_image
  variables:
    EXTRA_SETUP_FILES: "--native-file ci/respdiff.ini"
    MAX_DISAGREEMENTS_PERCENTAGE: "0.3"
  script:
    - bash respdiff.sh -m /usr/lib/x86_64-linux-gnu/libjemalloc.so.2 -s named -q "${PWD}/100k_mixed.txt" -c 3 -w "${PWD}/rspworkdir" -r "${PWD}/respdiff" "${CI_PROJECT_DIR}" "/usr/local/respdiff-reference-bind/sbin/named"
    - cd ../.. && ninja -C build clean >/dev/null 2>&1

respdiff-third-party:
  <<: *respdiff_job
  <<: *base_image
  variables:
    EXTRA_SETUP_FILES: "--native-file ci/respdiff-third-party.ini"
    MAX_DISAGREEMENTS_PERCENTAGE: "0.5"
  script:
    - bash respdiff.sh -s third_party -q "${PWD}/100k_mixed.txt" -c 1 -w "${PWD}/rspworkdir" -r "${PWD}/respdiff" "${CI_PROJECT_DIR}"
    - cd ../.. && ninja -C build clean >/dev/null 2>&1
